name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Sync locked environment
        run: uv sync --frozen --extra test
      - name: Validate package build
        run: uv build
      - name: Unit tests
        run: uv run pytest tests -v
      - name: Import public Forge packages
        run: uv run python -c "import forge_common, forge_msgs, forge_robot"
      - name: Load MuJoCo model
        run: >-
          uv run python -c "import mujoco;
          model=mujoco.MjModel.from_xml_path('assets/mjcf/scene.xml');
          print(f'MuJoCo model loaded: nq={model.nq}, nu={model.nu}')"
      - name: License and public-tree checks
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_NOTICES.md
          ! git grep -n -E 'gitlab\.ex-ai\.cn|meta-emt|/home/exai|/Users/|forge_robots|robot-mj-model|robot_asset_pipeline' -- ':!.github/workflows/*'

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Export and audit locked runtime dependencies
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project --output-file /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan publishable text for secrets
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '^(\.git/|assets/(glb|mjcf|urdf|usd|png)/|third_party/)' > /tmp/secrets.json
          python - <<'PY'
          import json
          with open("/tmp/secrets.json", encoding="utf-8") as stream:
              findings = json.load(stream).get("results", {})
          if findings:
              raise SystemExit(f"Potential secrets detected: {findings}")
          PY
