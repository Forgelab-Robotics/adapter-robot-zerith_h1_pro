# Zerith H1 Pro 远程 PC 运行配置示例
# 适用于 Forge / Dora 运行在远程 PC，H1 SDK 通过机器人 IP 连接本体。

# 远程 PC 上的 SDK 根目录；默认使用本包内 vendored 的 Python 3.12 SDK。
sdk_root: ../third_party/H1_SDK_1.3.7

# 机器人 IP。优先使用有线固定 IP；Wi-Fi 场景建议做 DHCP 静态租约。
robot_ip: 10.10.10.20

# 远程 PC 作为从站，接收 task_robot / policy 下发的 command。
is_follower: true

# 连接后初始化机器人，正式 follower 运行建议保持 true。
init_on_connect: true

# follower 的 motor-level command 仅在 LOW_LEVEL 下执行。
control_mode: low_level

# 连接后自动切换到 control_mode。
switch_mode_on_connect: true

# 是否打印调试日志。
debug: false

# 生命周期位姿配置。关节单位为弧度，lift / gripper 单位为米；未写执行器使用默认值。
# wheel_left / wheel_right 不参与生命周期 position，但保留在 JointCommand/JointState velocity 合同中。
# initial: 从臂连接初始化后移动到此位，默认 lift=0.5、双夹爪 opening=0.08，其余 0。
# reset: 从臂断开前移动到此安全位，默认 lift=0.5、双夹爪 opening=0.08，其余 0。
# initial/reset 从当前实际位置平滑移动到目标位姿的时长（秒）。
lifecycle_position_move_seconds: 3.0
# positions:
#   initial:
#     lift: 0.5
#     left_arm_2: 0.5
#     right_arm_2: -0.5
#     left_gripper: 0.04
#     right_gripper: 0.04
#   reset:
#     lift: 0.0
#     left_arm_2: 0.0
#     right_arm_2: 0.0

# LOW_LEVEL 移动底盘安全参数。轮径/轮距来自交付模型，真机启用前必须复核。
wheel_radius_m: 0.0835
wheel_track_width_m: 0.379
locomotion_max_vx_mps: 0.08
locomotion_max_wz_radps: 0.4
locomotion_max_wheel_speed_radps: 1.0
locomotion_command_timeout_seconds: 0.25

# 相机 gRPC 地址自动使用 robot_ip:50051。
# 可选：覆盖通用 23 项 actuator 顺序；wheel 可按 velocity 模式保留，且须与 task_robot 一致。
# actuator_order:
#   - left_arm_1
#   - left_arm_2
#   - left_arm_3
