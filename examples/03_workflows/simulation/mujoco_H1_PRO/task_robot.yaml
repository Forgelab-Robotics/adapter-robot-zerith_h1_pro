# 与 simulator.yaml 的 joints / robots 映射保持一致
joints:
  - { name: daogui_joint, mode: position, unit: meters }
  - { name: body_pitch_joint, mode: position, unit: radians }
  - { name: body_yaw_joint, mode: position, unit: radians }
  - { name: left_shoulder_pitch_joint, mode: position, unit: radians }
  - { name: left_shoulder_roll_joint, mode: position, unit: radians }
  - { name: left_shoulder_yaw_joint, mode: position, unit: radians }
  - { name: left_elbow_joint, mode: position, unit: radians }
  - { name: left_wrist_roll_joint, mode: position, unit: radians }
  - { name: left_wrist_yaw_joint, mode: position, unit: radians }
  - { name: left_wrist_pitch_joint, mode: position, unit: radians }
  - { name: left_jaw_left_finger_joint, mode: position, unit: meters }
  - { name: left_jaw_right_finger_joint, mode: position, unit: meters }
  - { name: right_shoulder_pitch_joint, mode: position, unit: radians }
  - { name: right_shoulder_roll_joint, mode: position, unit: radians }
  - { name: right_shoulder_yaw_joint, mode: position, unit: radians }
  - { name: right_elbow_joint, mode: position, unit: radians }
  - { name: right_wrist_roll_joint, mode: position, unit: radians }
  - { name: right_wrist_yaw_joint, mode: position, unit: radians }
  - { name: right_wrist_pitch_joint, mode: position, unit: radians }
  - { name: right_jaw_left_finger_joint, mode: position, unit: meters }
  - { name: right_jaw_right_finger_joint, mode: position, unit: meters }
  - { name: neck_yaw_joint, mode: position, unit: radians }
  - { name: neck_pitch_joint, mode: position, unit: radians }
  - { name: left_middle_wheel_joint, mode: velocity, unit: radians/s }
  - { name: right_middle_wheel_joint, mode: velocity, unit: radians/s }

robots:
  - id: robot_0
    joints:
      - daogui_joint
      - body_pitch_joint
      - body_yaw_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_yaw_joint
      - left_wrist_pitch_joint
      - left_jaw_left_finger_joint
      - left_jaw_right_finger_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_yaw_joint
      - right_wrist_pitch_joint
      - right_jaw_left_finger_joint
      - right_jaw_right_finger_joint
      - neck_yaw_joint
      - neck_pitch_joint
      - left_middle_wheel_joint
      - right_middle_wheel_joint

image_forward:
  image/global_overview: image/global_overview
  image/left_d405: image/left_d405
  image/right_d405: image/right_d405
  image/neck_d435: image/neck_d435
